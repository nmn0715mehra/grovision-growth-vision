name: Deploy GROVISION to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Resolve build output directory
        id: outdir
        run: |
          for d in dist/client .output/public dist/public dist; do
            if [ -f "$d/index.html" ]; then
              echo "path=$d" >> "$GITHUB_OUTPUT"
              echo "Using $d"
              exit 0
            fi
          done
          echo "No build output with index.html found:" >&2
          ls -R dist .output 2>/dev/null | head -50 >&2
          exit 1

      - name: Add Pages fallbacks
        run: |
          touch "${{ steps.outdir.outputs.path }}/.nojekyll"
          cp "${{ steps.outdir.outputs.path }}/index.html" "${{ steps.outdir.outputs.path }}/404.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.outdir.outputs.path }}


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
